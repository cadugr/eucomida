# Materializa eucomida/mysql (Vault) como o Secret "mysql-credentials",
# consumido pelo Deployment em mysql.yaml. Sincronizado pela mesma
# Application do MySQL (eu-comida-mysql), via directory.include: "mysql*.yaml".
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mysql-credentials
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-eucomida
    kind: ClusterSecretStore
  target:
    name: mysql-credentials
  data:
    - secretKey: username
      remoteRef:
        key: mysql
        property: username
    - secretKey: password
      remoteRef:
        key: mysql
        property: password
