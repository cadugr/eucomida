# Materializa eucomida/mysql + eucomida/rabbitmq (Vault) como o Secret
# "app-credentials" — o app precisa das credenciais de AMBOS para se
# conectar. Um único ExternalSecret pode combinar valores de mais de um
# caminho do Vault no mesmo Secret de destino. Sincronizado pela mesma
# Application do app (eu-comida-app), via directory.include: "app*.yaml".
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: app-credentials
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-eucomida
    kind: ClusterSecretStore
  target:
    name: app-credentials
  data:
    - secretKey: mysql-username
      remoteRef:
        key: mysql
        property: username
    - secretKey: mysql-password
      remoteRef:
        key: mysql
        property: password
    - secretKey: rabbitmq-username
      remoteRef:
        key: rabbitmq
        property: username
    - secretKey: rabbitmq-password
      remoteRef:
        key: rabbitmq
        property: password
