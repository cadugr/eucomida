# Materializa eucomida/rabbitmq (Vault) como o Secret "rabbitmq-credentials",
# consumido pelo Deployment em rabbitmq.yaml. Sincronizado pela mesma
# Application do RabbitMQ (eu-comida-rabbitmq), via directory.include:
# "rabbitmq*.yaml".
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: rabbitmq-credentials
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-eucomida
    kind: ClusterSecretStore
  target:
    name: rabbitmq-credentials
  data:
    - secretKey: username
      remoteRef:
        key: rabbitmq
        property: username
    - secretKey: password
      remoteRef:
        key: rabbitmq
        property: password
