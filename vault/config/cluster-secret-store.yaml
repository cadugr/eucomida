# ClusterSecretStore: conecta o External Secrets Operator ao Vault.
# Cluster-scoped (não namespaced) de propósito — as credenciais de
# mysql/rabbitmq precisam ser materializadas tanto em "eucomida" (o app)
# quanto em "eucomida-infra" (os próprios MySQL/RabbitMQ), e um
# ClusterSecretStore pode ser referenciado por ExternalSecrets de qualquer
# namespace, evitando duplicar a definição da conexão por namespace.
#
# A autenticação usa o auth method Kubernetes configurado em
# vault/bootstrap.sh: a role "eucomida-external-secrets", vinculada
# especificamente à ServiceAccount "external-secrets-sa" no namespace
# "external-secrets-system" — a mesma SA que o controller do ESO usa (ver
# argocd/eu-comida-external-secrets.yaml). Só ela tem permissão para logar
# com essa role.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: vault-eucomida
spec:
  provider:
    vault:
      server: "http://eu-comida-vault.vault.svc.cluster.local:8200"
      path: "eucomida"
      version: "v2"
      auth:
        kubernetes:
          mountPath: "kubernetes"
          role: "eucomida-external-secrets"
          serviceAccountRef:
            name: "external-secrets-sa"
            namespace: "external-secrets-system"
