# ArgoCD Application para o componente da aplicação "eu-comida" (Deployment + Service).
# Este manifesto é aplicado UMA VEZ diretamente no cluster (namespace argocd).
# A partir daí, o ArgoCD passa a sincronizar automaticamente k8s/app.yaml
# neste repositório (branch main) — o repo é a fonte de verdade.
#
# Separado das Applications de MySQL/RabbitMQ (eu-comida-mysql, eu-comida-rabbitmq)
# porque este componente é STATELESS e muda a cada push na main (nova imagem
# publicada pelo CI). Isolar o app evita que o ciclo de deploy dele afete o
# status/sync da infraestrutura, e vice-versa.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: eu-comida-app
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/cadugr/eucomida.git
    targetRevision: main
    path: k8s
    directory:
      include: "app.yaml"

  destination:
    server: https://kubernetes.default.svc
    namespace: eucomida

  syncPolicy:
    automated:
      prune: true       # ok remover recursos do app removidos do Git: é stateless, barato recriar
      selfHeal: true     # reverte mudanças manuais feitas direto no cluster
    syncOptions:
      - CreateNamespace=true   # cria o namespace "eucomida" automaticamente
