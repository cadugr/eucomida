# ArgoCD Application para o External Secrets Operator (via Helm chart oficial).
# Mecanismo escolhido para trazer segredos do Vault para dentro do cluster
# como Secrets nativos do Kubernetes — ver vault/bootstrap.sh para o auth
# method/role/policy do lado do Vault que este operator consome.
#
# Namespace dedicado "external-secrets-system": é infraestrutura de
# plataforma (o operator, não um segredo específico do eu-comida), mesma
# lógica de isolamento usada para "vault".
#
# serviceAccount.name É FIXADO como "external-secrets-sa" de propósito —
# é exatamente o nome que a role "eucomida-external-secrets" do Vault espera
# (bound_service_account_names/bound_service_account_namespaces em
# vault/bootstrap.sh). Se esse nome mudar aqui, o auth Kubernetes do Vault
# para de reconhecer o operator.
#
# Stateless (sem PVC) — diferente de Vault/MySQL/RabbitMQ, prune:true é
# seguro aqui.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: eu-comida-external-secrets
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://charts.external-secrets.io
    chart: external-secrets
    targetRevision: "2.10.0"
    helm:
      values: |
        serviceAccount:
          create: true
          name: external-secrets-sa

  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets-system

  syncPolicy:
    automated:
      prune: true       # operator stateless, sem PVC — ok remover se sair do Git
      selfHeal: true     # reverte mudanças manuais feitas direto no cluster
    syncOptions:
      - CreateNamespace=true   # cria o namespace "external-secrets-system" automaticamente
      # As CRDs deste chart (secretstores/clustersecretstores) são grandes o
      # suficiente para estourar o limite de 262144 bytes da anotação
      # last-applied-configuration usada no apply client-side padrão.
      # Server-side apply não usa essa anotação, evitando o erro.
      - ServerSideApply=true
      # NOTA OPERACIONAL: mesmo com ServerSideApply=true, os CRDs
      # secretstores/clustersecretstores podem precisar de uma intervenção
      # manual na primeira instalação (ou numa atualização de versão do
      # chart), porque o ArgoCD esgota as tentativas automáticas (5 retries)
      # rápido demais. Se a Application ficar "OutOfSync"/"SyncError" citando
      # "metadata.annotations: Too long", aplique os 2 CRDs manualmente:
      #   helm template eso external-secrets/external-secrets --version <X> \
      #     --show-only templates/crds/secretstore.yaml | \
      #     kubectl apply --server-side --force-conflicts -f -
      #   (repetir trocando "secretstore.yaml" por "clustersecretstore.yaml")
      # depois reinicie o pod do controller (ele guarda um cache do
      # discovery de API que fica desatualizado se subiu antes dos CRDs
      # existirem):
      #   kubectl delete pod -n external-secrets-system -l app.kubernetes.io/name=external-secrets
