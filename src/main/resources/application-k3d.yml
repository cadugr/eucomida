spring:
  datasource:
    # MySQL vive no namespace "eucomida-infra" (separado do namespace "eucomida"
    # onde o app roda), por isso o FQDN cross-namespace em vez do nome curto do Service.
    url: jdbc:mysql://mysql-service.eucomida-infra.svc.cluster.local:3306/eucomida_database?createDatabaseIfNotExist=true
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  rabbitmq:
    # RabbitMQ vive no namespace "eucomida-infra" — mesmo motivo acima.
    host: rabbitmq-service.eucomida-infra.svc.cluster.local
    port: 5672
    username: ${SPRING_RABBITMQ_USERNAME}
    password: ${SPRING_RABBITMQ_PASSWORD}
