# Configuração usada SOMENTE durante a execução dos testes.
# Sobrescreve src/main/resources/application.yaml automaticamente (o Spring
# Boot dá precedência ao application.yml encontrado em test-classes), para
# que os testes não dependam de MySQL/RabbitMQ reais — necessário para rodar
# no runner do GitHub Actions, que não tem esses serviços disponíveis.
spring:
  # Ativa o perfil "test", que desliga RabbitMQConfig/RabbitMQInitializer
  # (via @Profile("!test")) — evitando a declaração ativa de fila/exchange
  # no broker durante a subida do contexto nos testes.
  profiles:
    active: test
  datasource:
    url: jdbc:h2:mem:eucomida;MODE=MySQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
  # Flyway usa migrations específicas de MySQL; no H2 deixamos o Hibernate
  # criar o schema a partir das entidades (ddl-auto acima).
  flyway:
    enabled: false
  # Evita que o listener (@RabbitListener) tente conectar a um broker real
  # ao subir o contexto do Spring durante os testes.
  rabbitmq:
    listener:
      simple:
        auto-startup: false
